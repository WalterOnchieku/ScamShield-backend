[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scamshield-api"
version = "0.1.0"
description = "FastAPI backend for ScamShield"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "scikit-learn",
    "joblib",
    "pydantic-settings",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"src/scamshield/main.py" = ["B008"]
